        const zodiacData = [
            { id: 'ariete', name: 'Ariete', dates: '21 Mar - 19 Apr', element: 'Fuoco', icon: zodiacPaths.ariete },
            { id: 'toro', name: 'Toro', dates: '20 Apr - 20 Mag', element: 'Terra', icon: zodiacPaths.toro },
            { id: 'gemelli', name: 'Gemelli', dates: '21 Mag - 20 Giu', element: 'Aria', icon: zodiacPaths.gemelli },
            { id: 'cancro', name: 'Cancro', dates: '21 Giu - 22 Lug', element: 'Acqua', icon: zodiacPaths.cancro },
            { id: 'leone', name: 'Leone', dates: '23 Lug - 22 Ago', element: 'Fuoco', icon: zodiacPaths.leone },

        // --- MOTORE DI GENERAZIONE ---
        const getDailyRandom = (seedString) => {
            let hash = 0;
            for (let i = 0; i < seedString.length; i++) hash = ((hash << 5) - hash) + seedString.charCodeAt(i) | 0;
            return Math.abs(hash);
        };

        const generateRomanHoroscope = (sign) => {
            const today = new Date().toISOString().slice(0, 10);
            const seed = getDailyRandom(today + sign.id);
            
            // 1. INCIPIT (30 Varianti)
            const intros = [
                "Aò, stamme a sentì:", "Allora, le carte dicono:", "Oggi er cielo parla chiaro:", "Sentime bene:", "Oggi va così:", 
                "Nun te la prendere, ma:", "Aò, apri l'orecchie:", "Le stelle c'hanno da dì:", "Guarda che roba oggi:", "Me sa che oggi:",
                "Senti che aria tira:", "Famo n'po' er punto:", "Vedi de non svenì:", "Ahò, ma che davero?", "Oggi è 'na giornata strana:",
                "Er destino t'ha puntato:", "Si, parlo co te:", "Nun fa quella faccia:", "Te lo dico cor core:", "Senti 'sta sentenza:",
                "Aripijate e senti qua:", "Oggi le stelle so' strane:", "Er cosmo te guarda:", "Nun te vojo spaventà:", "Preparate ar peggio (o ar mejo):",
                "Oggi butta male... o forse no:", "Aò, svejate che è ora:", "Er cielo sopra Roma dice:", "Manco l'oracolo ce crede:", "Oggi c'hai Saturno che te guarda:"
            ];

            // 2. FRASE SPECIFICA DEL SEGNO (5 Varianti per segno = 60 Uniche)
            // Questo rende impossibile che due segni abbiano lo stesso testo
            const signSpecific = {
                'ariete': [
                    "c'hai la testa dura come i sampietrini, ma oggi te serve.", "sei partito a razzo, ma occhio a non finì la benzina subbito.",
                    "te senti er padrone de Roma, ma ricordate che c'è pure er traffico.", "voi tutto e subito, ma oggi te tocca aspettà come alle poste.",
                    "sei 'n foco che cammina, vedi de non brucià la casa."
                ],
                'toro': [
                    "tu pensi solo a magnà e a stà comodo, e oggi fai pure bene.", "sei lento a partì, ma quando parti sei n'trattore sulla Pontina.",
                    "te sei impuntato su na cosa inutile, lassa perde.", "oggi la pazienza tua è finita, chi tocca more.",
                    "godite le cose belle, che pe le brutte c'è tempo."
                ],
                'gemelli': [
                    "oggi c'hai na faccia pe ogni occasione, decidi quale usà.", "parli troppo, oggi statte zitto e ascolta n'po'.",
                    "sei confuso come n'turista a Termini, pija na direzione.", "c'hai l'argento vivo addosso, ma fermate n'attimo.",
                    "fai pace cor cervello tuo, che state a litigà da stamattina."
                ],
                'cancro': [
                    "stai a fa er drammatico pe gnente, asciugate ste lacrime.", "sei permaloso oggi, manco 'buongiorno' te se pò dì.",
                    "te voi chiude in casa a guscio, ma fori c'è er sole.", "oggi c'hai la luna storta proprio come te.",
                    "proteggi le cose tue, ma non abbaià a tutti."
                ],
                'leone': [
                    "te senti er Re de la foresta, ma oggi sei più n'gatto da divano.", "abbassa la cresta, che oggi non è aria.",
                    "voi gli applausi, ma oggi c'è solo silenzio, fattene na ragione.", "sei generoso, ma occhio che te se magnano tutto.",
                    "oggi brilli, ma attento a non accecà chi te sta vicino."
                ],
                'vergine': [
                    "stai a controllà pure i peli nell'uovo, rilassate n'attimo.", "c'hai l'ansia pure pe respirà, ma che te frega?",
                    "voi tutto perfetto, ma Roma è bella perchè è n'casino.", "oggi critichi pure i sassi, fatte i fatti tuoi.",
                    "organizza meno e vivi de più, damme retta."
                ],
                'bilancia': [
                    "non sai decide manco che pizza pija, figuramoce er resto.", "te stai a fa troppi problemi d'estetica, la sostanza ndo sta?",
                    "voi andà d'accordo co tutti, ma oggi mannane qualcuno a quel paese.", "sei n'fiore de campo, ma occhio a chi te vole coglie.",
                    "cerca l'equilibrio, ma se cadi, cadi co stile."
                ],
                'scorpione': [
                    "oggi c'hai n'veleno addosso che manco le vipere.", "sei misterioso, ma a volte pari solo strano.",
                    "te la sei legata al dito, ma mo slegala che t'è andata in cancrena.", "sei intenso, ma oggi pari n'film horror.",
                    "usa l'intuito tuo pe capì chi te vole fregà."
                ],
                'sagittario': [
                    "voi scappà via, ma te tocca stà qua a lavorà.", "spari cazzate a raffica oggi, ma sei simpatico.",
                    "sei ottimista pure mentre affondi, beato te.", "oggi fai er passo più lungo della gamba, occhio allo strappo.",
                    "c'hai la fretta addosso, ma ndo corri?"
                ],
                'capricorno': [
                    "lavori troppo, pari n'mulo da soma, pija n'caffè.", "sei freddo come er marmo der Verano, scojite n'po'.",
                    "voi arrivà in cima, ma ricordate de salutà chi sta sotto.", "oggi sei severo ma giusto, forse troppo severo.",
                    "i sordi non so tutto, ma aiutano, e tu lo sai bene."
                ],
                'acquario': [
                    "stai ner mondo tuo, scenni sulla terra n'attimo.", "oggi sei strano forte, ma te piace così.",
                    "voi cambià er monno, ma inizia a rifà er letto.", "sei libero come l'aria, ma oggi c'è vento forte.",
                    "fai er bastian contrario solo pe dillo."
                ],
                'pesci': [
                    "stai a sognà a occhi aperti, occhio ar palo.", "te commuovi pure pe la pubblicità, oggi sei na fontana.",
                    "sei bono e caro, ma non te fa pestà i piedi.", "c'hai n'casino in testa che manco er mercato de Porta Portese.",
                    "segui l'onda, ma vedi de non affogà."
                ]
            };

            // 3. SITUAZIONE (100 Varianti Generiche)
            const middles = [
                "l'amore è come er Raccordo: na cosa complicata, ma prima o poi arivi.", "sul lavoro fai er vago, come quando passa er controllore.",
                "c'hai n'energia che potresti illuminà San Pietro a gratis.", "se pensi de avè ragione, ricordate che pure i matti so convinti.",
                "oggi statte bono, fatti du spaghi, n'bicchiere de vino e non ce pensà.", "la fortuna te gira intorno, ma te stai a guardà er telefono.",
                "sei più acido de uno yogurt scaduto nel 92, fatte na risata.", "oggi splendi più der sole su la via Casilina.",

                "oggi sei lento, ma lento forte, tipo le poste.", "c'hai er fascino de n'attore de Cinecittà.",
                "se devi fa na scelta, tira la monetina che è mejo.", "non te fidà manco de l'ombra tua oggi.",
                "la vita è na ruota, e oggi te tocca stà sotto.", "ma che t'hanno fatto? Pari n'cero votivo.",
                "oggi risolvi tutto co n'alzata de spalle e n'sorriso.", "l'amore è nell'aria... o forse è solo puzza de fritto.",
                "te senti fluido come er Tevere, ma occhio ai detriti.", "sei concreto come n'mattone forato.",
                "oggi bruci de passione, ma attento a non scottatte.", "hai la testa tra le nuvole, scenni giù che se tocca.",
                "sei prezioso come n'parcheggio a Trastevere sabato sera.", "oggi te rimbalza tutto, sei impermeabile.",
                "la giornata promette bene, se non esci de casa.", "sei n'mistero pure pe te stesso.",
                "oggi c'hai la luna storta e er sole pure peggio.", "te senti ispirato, scrivi na poesia o fai la spesa.",
                "la fortuna è cieca, ma la sfiga ce vede benissimo.", "oggi sei na molla pronta a scattà.",
                "c'hai n'aura potente, sposti gli oggetti col pensiero.", "sei in sintonia coll'universo, ma l'universo non lo sa.",
                "oggi te senti 'n re, ma occhio alla ghigliottina.", "sei come er Colosseo: maestoso ma pieno de gente.",
                "fai come er Tevere: scorri e portate via tutto.", "oggi n'te va bene niente, manco se te regalano i sordi.",
                "sei confuso, ma felice.", "c'hai na voglia de lavorà che saltame addosso.",
                "er partner te sta a studià, vedi de non fallì.", "c'hai i nervi a fior de pelle.",
                "sei carico, ma a salve.", "oggi vedi la luce in fondo ar tunnel (speramo non sia er treno).",
                "sei na pentola a pressione, sfiata n'po'."
            ];

            // 4. CHIUSURA (30 Varianti)
            const outros = [
                "Daje forte!", "Stacce e non te lamentà.", "Ho detto tutto.", "Mo vedi che devi fa.", "Bona così, a domani.", 
                "E se non te sta bene, dillo a Saturno.", "Daje, su col morale.", "E ricordate: chi se fa li fatti sua...", "Amen.", "Vedi d'annà piano.",
                "E non te scordà de soride.", "Vai e spacca tutto.", "Speramo bene.", "Vattelapesca.", "Magna e fregatene.",
                "Pija la vita come viene.", "Sei forte, ricordatelo.", "Mò statte bono.", "Chiudi l'occhi e spera.", "Arrivederci e grazie.",
                "Nun mollà manco de n'centimetro.", "A la prossima puntata.", "Che la forza sia con te.", "Statte accorto.", "Daje de tacco e de punta.",
                "E se caschi, rialzate.", "Ma che te lo dico a fa?", "Buona fortuna, ne hai bisogno.", "T'ho detto tutto, mo so cavoli tui.", "Ciao core."
            ];
            
            const advices = [
                "Spegni er telefono n'ora.", "Offri n'caffè a n'amico.", "Sorridi ar fornaio.", "Fai pace cor cervello.", 
                "Magnate na cosa bona.", "Nun te incazzà.", "Chiama tu madre.", "Fai finta de niente.", "Respira forte.", "Fatte n'giro ar centro.",
                "Evita de discute cor capo.", "Compra n'Gratta e Vinci (uno solo).", "Stasera niente TV, esci.", "Mettite n'vestito che te piace.",
                "Nun te fidà de chi dice 'te chiamo io'.", "Smetti de guardà er telefono a tavola.", "Dì de no se non te va.", "Guarda dove metti i piedi.",
                "Nun te magnà le unghie.", "Fai pace co te stesso.", "Ascolta na canzone romana.", "Bevi più acqua (o vino).",
                "Non rimandà a domani quello che poi fa oggi.", "Fai n'complimento a qualcuno.", "Lassa perde i pettegolezzi.",
                "Fatte na dormita in più.", "Non corre, che tanto arivi uguale.", "Saluta er vicino de casa.", "Pija er sole se c'è.",
                "Non spenne soldi inutili.", "Fai n'respiro e conta fino a 10.", "Ricordate chi sei.", "Non te fa mette i piedi in testa.",
                "Ridi, che è gratis.", "Non pensà troppo al passato.", "Godite er momento.", "Fai na cosa matta.",
                "Non te lamentà pe n'giorno.", "Fai del bene e scordate.", "Volate basso oggi."
            ];

            const foods = ["Carbonara", "Cacio e Pepe", "Amatriciana", "Gricia", "Pajata", "Supplì", "Maritozzo", "Carciofo alla Giudia", "Trippa", "Saltimbocca", "Pizza Bianca", "Filetti di Baccalà", "Coda alla Vaccinara", "Abbacchio a scottadito", "Puntarelle", "Gnocchi alla Romana", "Fave e Pecorino", "Crostata di Visciole", "Grattachecca", "Pollo coi peperoni", "Fagioli con le cotiche", "Pizzette rosse", "Vignarola", "Porchetta", "Ciambelline al vino"];
            
            const moods = [
                { icon: "🤯", label: "Esaurito" }, { icon: "🥳", label: "In Festa" }, { icon: "😴", label: "Abbioccato" }, 
                { icon: "🤬", label: "Nerissimo" }, { icon: "🤩", label: "Stellare" }, { icon: "🥶", label: "Ghiacciato" }, 
                { icon: "🌶️", label: "Piccante" }, { icon: "💸", label: "Al verde" }, { icon: "👀", label: "Guardingo" },
                { icon: "🦁", label: "Leone" }, { icon: "🦄", label: "Magico" }, { icon: "🌪️", label: "Caotico" },
                { icon: "🔋", label: "Carico" }, { icon: "🪫", label: "Scarico" }, { icon: "🍷", label: "'Mbriaco" }
            ];

            // Selezioni casuali basate sul seed
            const idx = (n, arr) => (seed * n) % arr.length;
            
            // Logica specifica: Intro + FraseSegno + FraseGenerica + Outro
            const specificPhrase = signSpecific[sign.id][idx(5, signSpecific[sign.id])];
            const middlePhrase = middles[idx(7, middles)];
            
            return {
                text: `${intros[idx(1, intros)]} ${specificPhrase} ${middlePhrase} ${outros[idx(3, outros)]}`,
                advice: advices[idx(11, advices)],
                food: foods[idx(17, foods)],
                mood: moods[idx(23, moods)],
                numbers: [(seed % 90) + 1, ((seed * 5) % 90) + 1, ((seed * 11) % 90) + 1],
                stats: { 
                    love: (seed % 60) + 40, 
                    work: ((seed * 7) % 60) + 30, 
                    luck: ((seed * 13) % 60) + 20 
                }
            };
        };

        const generateRanking = () => {
            const ranking = [...zodiacData].sort((a, b) => {
                const scoreA = getDailyRandom(new Date().toISOString().slice(0, 10) + a.id);
                const scoreB = getDailyRandom(new Date().toISOString().slice(0, 10) + b.id);
                return scoreB - scoreA;
            });
            return ranking;
        };

        // --- COMPONENTI UI ---

        const StarField = ({ theme }) => {
            const stars = useMemo(() => [...Array(50)].map((_, i) => ({
                top: `${Math.random() * 100}%`,
                left: `${Math.random() * 100}%`,
                size: `${Math.random() * 3}px`,
                duration: `${Math.random() * 3 + 2}s`
            })), []);

            return (
                <div className={`fixed inset-0 pointer-events-none z-0 ${theme === 'dark' ? 'bg-slate-950' : 'bg-stone-50'}`}>
                    <div className={`absolute inset-0 bg-gradient-to-b opacity-80 ${theme === 'dark' ? 'from-slate-900 to-indigo-950' : 'from-orange-50 to-amber-50'}`} />
                    {stars.map((s, i) => (
                        <div key={i} className={`absolute rounded-full animate-pulse ${theme === 'dark' ? 'bg-white' : 'bg-yellow-500'}`}
                             style={{ top: s.top, left: s.left, width: s.size, height: s.size, animationDuration: s.duration }} />
                    ))}
                </div>
            );
        };

        const Header = ({ toggleTheme, theme }) => (
            <nav className={`relative z-20 flex justify-between items-center p-4 border-b backdrop-blur-md transition-colors duration-300 ${theme === 'dark' ? 'border-white/10 bg-slate-900/80 text-white' : 'border-black/5 bg-white/80 text-slate-900'}`}>
                <div className="flex items-center gap-3">
                    <div className="text-3xl animate-spin-slow">☀️</div>
                    <div>
                        <h1 className="text-xl font-black italic tracking-tighter leading-none">AstriVostri</h1>
                        <p className="text-[10px] font-bold uppercase opacity-60">Oroscopo Romano</p>
                    </div>
                </div>
                <button onClick={toggleTheme} className="p-2 rounded-full border border-current/20 hover:bg-current/10 transition">
                    <Icon path={theme === 'dark' ? Icons.Sun : Icons.Moon} className="w-5 h-5" />
                </button>
            </nav>
        );

        const Ranking = ({ theme }) => {
            const ranking = useMemo(() => generateRanking(), []);
            
            const loserPhrases = [
                "Aò, oggi statte a casa.", "Manco er cane te da retta.", "Fai finta de esse n'altro segno.",
                "Se te cade na moneta, non la raccoglie.", "Oggi sei utile come n'semaforo a li Prati.",
                "Consiglio: torna a dormì.", "Ma che t'hanno fatto le stelle oggi?", "Sei messo male, ma domani è n'artro giorno.",
                "Oggi pure er gatto nero se tocca quanno te vede.", "Meglio che nun te alzi proprio."
            ];
            const randomLoserPhrase = useMemo(() => loserPhrases[Math.floor(Math.random() * loserPhrases.length)], []);

            return (
                <div className={`mx-auto max-w-lg mb-10 p-4 rounded-2xl border shadow-lg ${theme === 'dark' ? 'bg-slate-900/80 border-white/10' : 'bg-white/80 border-black/5'}`}>
                    <div className="flex items-center justify-center gap-2 mb-4 text-xs font-black uppercase tracking-widest text-yellow-500">
                        <Icon path={Icons.Trophy} className="w-4 h-4" /> La Classifica de Oggi
                    </div>
                    
                    <div className="space-y-2">
                        {/* Top 3 */}
                        {ranking.slice(0, 3).map((sign, index) => (
                            <div key={sign.id} className={`flex items-center justify-between p-3 rounded-xl border-l-4 ${index === 0 ? 'bg-gradient-to-r from-yellow-500/20 to-transparent border-yellow-500' : 'bg-white/5 border-slate-400'}`}>
                                <div className="flex items-center gap-3">
                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center font-black text-xs ${index === 0 ? 'bg-yellow-500 text-black' : 'bg-slate-700 text-white'}`}>
                                        {index + 1}
                                    </div>
                                    <span className={`font-bold ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>{sign.name}</span>
                                </div>
                                {index === 0 && <Icon path={Icons.ArrowUp} className="w-5 h-5 text-green-500" />}
                            </div>
                        ))}

                        {/* Divider */}
                        <div className="py-2 text-center text-xs opacity-40">...e in fondo alla fila...</div>

                        {/* Ultimo */}
                        <div className={`flex flex-col p-3 rounded-xl border-l-4 border-red-500 ${theme === 'dark' ? 'bg-red-900/10' : 'bg-red-50'}`}>
                            <div className="flex items-center justify-between mb-1">
                                <div className="flex items-center gap-3">
                                    <div className="w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center font-black text-xs">12</div>
                                    <span className={`font-bold ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>{ranking[11].name}</span>
                                </div>
                                <Icon path={Icons.ArrowDown} className="w-5 h-5 text-red-500" />
                            </div>
                            <div className="text-xs italic opacity-70 pl-9">"{randomLoserPhrase}"</div>
                        </div>
                    </div>
                </div>
            );
        };

        const HoroscopeModal = ({ sign, isOpen, onClose, theme }) => {
            const [loading, setLoading] = useState(true);
            const [data, setData] = useState(null);
            const [isCapturing, setIsCapturing] = useState(false);
            const cardRef = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    setLoading(true);
                    setTimeout(() => {
                        setData(generateRomanHoroscope(sign));
                        setLoading(false);
                    }, 1200);
                }
            }, [isOpen, sign]);

            const handleShareImage = async () => {
                if (!cardRef.current || isCapturing) return;
                setIsCapturing(true);

                try {
                    const canvas = await html2canvas(cardRef.current, {
                        scale: 3, 
                        backgroundColor: theme === 'dark' ? '#0f172a' : '#fff7ed', 
                        useCORS: true
                    });

                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], `oroscopo-${sign.name}.png`, { type: 'image/png' });

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    files: [file],
                                    title: 'AstriVostri',
                                    text: `Ecco l'oroscopo romano pe ${sign.name}!`
                                });
                            } catch (e) { console.log('Condivisione annullata'); }
                        } else {
                            const link = document.createElement('a');
                            link.download = `AstriVostri-${sign.name}.png`;
                            link.href = canvas.toDataURL();
                            link.click();
                            alert("Immagine scaricata! Mo mandala a chi te pare.");
                        }
                        setIsCapturing(false);
                    }, 'image/png');

                } catch (err) {
                    console.error(err);
                    alert("Errore. Fai uno screenshot!");
                    setIsCapturing(false);
                }
            };

            if (!isOpen || !sign) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/90 backdrop-blur-sm animate-in fade-in" onClick={onClose} />
                    
                    <div className={`relative w-full max-w-md rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-300 theme-transition ${theme === 'dark' ? 'bg-slate-900' : 'bg-stone-50'}`}>
                        
                        <div className="p-4 flex justify-between items-center z-10">
                            <span className="text-[10px] font-black uppercase tracking-widest opacity-50">AstriVostri.com</span>
                            <button onClick={onClose} className={`p-2 rounded-full ${theme === 'dark' ? 'bg-white/10 text-white' : 'bg-black/10 text-black'}`}>
                                <Icon path={Icons.X} className="w-5 h-5" />
                            </button>
                        </div>

                        <div className="overflow-y-auto custom-scrollbar flex-grow p-4 pt-0">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-64 gap-4">
                                    <div className="animate-spin-slow text-4xl">🔮</div>
                                    <p className={`font-bold animate-pulse ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>Sto a legge le carte...</p>
                                </div>
                            ) : (
                                <div className="flex flex-col gap-6 items-center pb-4">
                                    
                                    {/* --- CARD DA CATTURARE --- */}
                                    <div 
                                        ref={cardRef} 
                                        className={`w-full p-6 rounded-2xl relative overflow-hidden flex flex-col gap-5 border-2 shadow-2xl ${theme === 'dark' ? 'bg-slate-900 border-yellow-600 text-white' : 'bg-orange-50 border-orange-400 text-slate-900'}`}
                                    >
                                        <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none"><span className="text-9xl">✨</span></div>
                                        
                                        <div className="flex items-center gap-3 border-b border-current/10 pb-4">
                                            <div className="text-4xl">{data.mood.icon}</div>
                                            <div>
                                                <h2 className="text-3xl font-black uppercase leading-none tracking-tight">{sign.name}</h2>
                                                <p className="text-xs font-bold opacity-60 uppercase">{sign.dates}</p>
                                            </div>
                                        </div>

                                        <div className="relative">
                                            <Icon path={Icons.Quote} className="w-6 h-6 opacity-20 absolute -top-3 -left-2" />
                                            <p className="font-serif-display text-2xl leading-tight italic px-2">
                                                "{data.text}"
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-3 gap-2">
                                            {[['Amore', data.stats.love, 'text-red-500'], ['Sordi', data.stats.work, 'text-blue-500'], ['Culo', data.stats.luck, 'text-green-500']].map(([l, v, c]) => (
                                                <div key={l} className={`text-center p-2 rounded-lg ${theme === 'dark' ? 'bg-white/5' : 'bg-white/40'}`}>
                                                    <div className={`text-lg font-black ${c}`}>{v}%</div>
                                                    <div className="text-[9px] uppercase font-bold opacity-60">{l}</div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className={`p-4 rounded-xl flex flex-col gap-3 ${theme === 'dark' ? 'bg-indigo-900/30 border border-indigo-500/30' : 'bg-indigo-50 border border-indigo-200'}`}>
                                            <div className="flex items-start gap-3">
                                                <Icon path={Icons.Lightbulb} className="w-5 h-5 shrink-0 opacity-70 mt-0.5" />
                                                <div>
                                                    <div className="text-[10px] uppercase font-bold opacity-60">Er Consiglio Arcano</div>
                                                    <div className="text-sm font-bold leading-tight">{data.advice}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-start gap-3 pt-2 border-t border-current/10">
                                                <Icon path={Icons.Utensils} className="w-5 h-5 shrink-0 opacity-70 mt-0.5" />
                                                <div>
                                                    <div className="text-[10px] uppercase font-bold opacity-60">Piatto del Giorno</div>
                                                    <div className="text-sm font-bold leading-tight">{data.food}</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-end pt-2">
                                            <div>
                                                <div className="text-[9px] uppercase font-bold opacity-60">Numeri</div>
                                                <div className="text-lg font-black tracking-widest">{data.numbers.join(' - ')}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[9px] font-black uppercase tracking-widest opacity-40">Oroscopo Romano</div>
                                                <div className="text-sm font-bold">astrivostri.com</div>
                                            </div>
                                        </div>
                                    </div>
                                    {/* --- FINE CARD CATTURA --- */}

                                    <button 
                                        onClick={handleShareImage}
                                        disabled={isCapturing}
                                        className={`w-full py-4 rounded-xl font-black text-sm uppercase tracking-widest flex items-center justify-center gap-2 transform transition active:scale-95 shadow-lg ${theme === 'dark' ? 'bg-yellow-500 text-slate-900 hover:bg-yellow-400' : 'bg-slate-900 text-white hover:bg-slate-800'}`}
                                    >
                                        {isCapturing ? <span className="animate-pulse">Sto a stampà...</span> : <><Icon path={Icons.Camera} className="w-5 h-5" /> Condividi Immagine</>}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Hero = ({ theme }) => {
            const today = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
            const [phrase, setPhrase] = useState("");

            useEffect(() => {
                // GENERATORE SOTTOTITOLO "INFINITO" (3 Blocchi x 20 frasi)
                const parts1 = ["Sceji er segno tuo.", "Vedi che dice er destino.", "Oggi ridi o piagni?", "Le stelle non mentono.", "Aò, che voi sapè?", "Er cielo sopra Roma.", "Oroscopo sincero.", "Mettite comodo.", "Nun c'è trucco.", "Pura verità.", "Astri e disastri.", "Senti qua.", "Oggi butta così.", "Fidate de me.", "Niente algoritmi.", "Solo cose vere.", "Lo dice er cosmo.", "Segni e sogni.", "Destino scritto.", "Parole sante."];
                const parts2 = ["Senza giri de parole.", "Pane ar pane, vino ar vino.", "Se te dice male, ridi.", "Manco Fox ce pija così.", "Tutto scritto, forse.", "Daje de tacco.", "Verità assoluta (quasi).", "Poche chiacchiere.", "Diretto e verace.", "Senza filtri.", "Crudo e nudo.", "Come viene viene.", "Manco tu madre te lo dice.", "Più chiaro de così.", "Scritto ner cielo.", "Tra n'supplì e n'consiglio.", "Più preciso der traffico.", "Senza inganni.", "Te lo dico in faccia.", "Manco li santi lo sanno."];
                const parts3 = ["E stacce.", "E nun te lamentà.", "E se non te piace, ciao.", "Garantito ar limone.", "Fidate de l'istinto.", "E speramo bene.", "E volemose bene.", "E bona così.", "E poi se vede.", "E tira a campà.", "E chi s'è visto s'è visto.", "E daje tutta.", "E non ce pensà.", "E mo so cavoli tui.", "E statte bono.", "E vedi de rigà dritto.", "E non fa er vago.", "E pensa positivo.", "E fatte n'risata.", "E daje Roma."];
                
                const r1 = parts1[Math.floor(Math.random() * parts1.length)];
                const r2 = parts2[Math.floor(Math.random() * parts2.length)];
                const r3 = parts3[Math.floor(Math.random() * parts3.length)];
                
                setPhrase(`${r1} ${r2} ${r3}`);
            }, []);
            
            return (
                <div className="relative z-10 text-center py-10 px-4">
                    <div className={`inline-flex items-center gap-2 px-4 py-1.5 rounded-full border text-xs font-bold mb-6 shadow-xl uppercase tracking-wider backdrop-blur-md cursor-default ${theme === 'dark' ? 'bg-slate-800/80 border-slate-700 text-slate-300' : 'bg-white/80 border-orange-200 text-slate-600'}`}>
                        <Icon path={Icons.Sun} className="w-3 h-3 text-yellow-500" />
                        <span className="capitalize">{today}</span>
                    </div>
                    <h1 className="text-5xl md:text-7xl font-black mb-4 tracking-tight drop-shadow-2xl text-transparent bg-clip-text bg-gradient-to-tr from-yellow-400 to-orange-600">
                        AstriVostri<span className={theme === 'dark' ? 'text-white' : 'text-slate-800'}>.com</span>
                    </h1>
                    <p className={`text-lg md:text-xl max-w-xl mx-auto mb-8 font-medium italic px-4 leading-relaxed ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>"{phrase}"</p>
                </div>
            );
        };

        const App = () => {
            const [selectedSign, setSelectedSign] = useState(null);
            const [theme, setTheme] = useState('dark');
            const [networkMsg, setNetworkMsg] = useState("");

            useEffect(() => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) setTheme('light');
                
                const nets = ["Se te senti sfigato vai su", "Consigliamo pure", "I cugini de campagna (e de oroscopo):", "Se cerchi artre risposte:", "Er network nostro:", "Perle de saggezza su:", "Se nun t'abbasta:"];
                setNetworkMsg(nets[Math.floor(Math.random() * nets.length)]);
            }, []);

            return (
                <div className={`min-h-screen font-sans transition-colors duration-500 ${theme === 'dark' ? 'bg-slate-950 text-slate-200' : 'bg-stone-50 text-stone-800'}`}>
                    <StarField theme={theme} />
                    
                    <Header toggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} theme={theme} />

                    <main className="container mx-auto px-4 py-8 relative z-10">
                        <Hero theme={theme} />
                        <Ranking theme={theme} />

                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 max-w-6xl mx-auto">
                            {zodiacData.map((sign) => (
                                <div 
                                    key={sign.id}
                                    onClick={() => setSelectedSign(sign)}
                                    className={`group relative p-6 rounded-2xl border-2 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-xl flex flex-col items-center text-center overflow-hidden ${theme === 'dark' ? 'bg-slate-900 border-slate-800 hover:border-yellow-500/50' : 'bg-white border-stone-200 hover:border-orange-400'}`}
                                >
                                    <div className={`absolute inset-0 bg-gradient-to-br opacity-0 group-hover:opacity-10 transition-opacity ${theme === 'dark' ? 'from-yellow-500 to-purple-600' : 'from-orange-400 to-red-500'}`} />
                                    <div className={`w-16 h-16 mb-4 rounded-full flex items-center justify-center transition-transform group-hover:scale-110 ${theme === 'dark' ? 'bg-slate-800 text-yellow-500' : 'bg-orange-50 text-orange-600'}`}>
                                        <Icon path={sign.icon} className="w-8 h-8" />
                                    </div>
                                    <h3 className="text-lg font-black uppercase tracking-wide">{sign.name}</h3>
                                    <p className="text-[10px] font-bold opacity-50 uppercase mt-1">{sign.dates}</p>
                                </div>
                            ))}
                        </div>

                        {/* Network Banner */}
                        <div className={`mt-16 mx-auto max-w-lg p-6 rounded-2xl border-2 border-dashed text-center ${theme === 'dark' ? 'bg-slate-900/50 border-slate-800' : 'bg-white/50 border-stone-300'}`}>
                            <p className="mb-3 font-bold text-sm opacity-70">{networkMsg}</p>
                            <div className="flex flex-col sm:flex-row justify-center gap-4 text-sm font-black tracking-widest">
                                <a href="https://oracoloderoma.com" className="text-yellow-500 hover:underline">ORACOLODEROMA.COM</a>
                                <a href="https://ammazzachesfiga.com" className="text-red-500 hover:underline">AMMAZZACHESFIGA.COM</a>
                            </div>
                        </div>

                    </main>

                    <footer className="relative z-10 text-center py-8 border-t border-current/5 opacity-60 text-xs">
                        &copy; 2024 AstriVostri. Fatto co'r core a Roma.
                    </footer>

                    <HoroscopeModal sign={selectedSign} isOpen={!!selectedSign} onClose={() => setSelectedSign(null)} theme={theme} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
