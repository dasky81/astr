        // --- Dati e Risorse ---

        const zodiacIcons = {

          leone: "M12 4a2 2 0 1 0-2 2 2 2 0 0 0 2-2m0 2c0 3-2 5-2 9s3 6 6 6 4-3 4-6-5-5-8-9",

        const zodiacData = [

        const getDailyRandom = (seedString) => {
          let hash = 0;
          for (let i = 0; i < seedString.length; i++) {
            const char = seedString.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
          }
          return Math.abs(hash);
        };

        const getDailyStats = (signId) => {
          const today = new Date().toISOString().slice(0, 10);
          const seed = getDailyRandom(today + signId);
          const love = (seed % 60) + 40;
          const work = ((seed * 7) % 60) + 30;
          const luck = ((seed * 13) % 60) + 20;
          const total = love + work + luck;
          return { love, work, luck, total };
        };

        const generateRanking = () => {
          const ranking = zodiacData.map(sign => {
            const stats = getDailyStats(sign.id);
            return { ...sign, score: stats.total };
          });
          return ranking.sort((a, b) => b.score - a.score);
        };

        const generateRomanHoroscope = (sign, element) => {
          const today = new Date().toISOString().slice(0, 10);
          const seed = getDailyRandom(today + sign.id);
          const stats = getDailyStats(sign.id);
          
          const intros = [
            "Aò, stamme a sentì bene oggi:", "Allora, le carte dicono questo:", "Oggi butta in na maniera strana:", "Senti n'po' che t'aspetta:", "Dunque, la situazione è questa:",
            "Nun te vojo mette ansia, ma...", "Apri bene le orecchie:", "Te lo dico cor core in mano:", "Er cielo oggi parla chiaro:", "Manco a dillo, oggi è così:",
            "Se fossi in te, oggi starei attento:", "Guarda, l'astri oggi so' 'n po' brilli:", "Ho visto le stelle e m'hanno detto:", "Amico mio, oggi è 'na giornata particolare:", "Non so come dirtelo, ma:",
            "Oggi er destino t'ha preso di mira:", "Famo a capisse, oggi va così:", "Senti che roba oggi:", "Me sa che oggi te tocca remà:", "L'oroscopo tuo oggi è 'n film:",
            "Aho, svejate che le stelle so' già operative:", "Te sei alzato cor piede giusto? Speramo:", "Er monno gira, e tu giri co lui:", "Vedi de non fa casini oggi:", "Oggi c'hai Saturno che te guarda male:",
            "Giove t'ha mandato n'messaggio su WhatsApp:", "Venere t'ha bloccato, ma Marte te segue:", "Ascolta er consiglio der vecchio Gigi:", "Mettite seduto che te devo dì na cosa:", "Oggi è er giorno tuo... o forse no:",

            "Nun te lamentà prima de sentì:", "Sei pronto? Allora senti qua:", "Oggi l'universo c'ha n'piano pe te:", "Forse era mejo se restavi a letto, ma vabbè:", "Oggi c'hai n'aura potente, pure troppo:"
          ];

          const middles = [
            "te senti carico a pallettoni, pronto a sfonnà tutto.", "la pazienza te sta a salutà co la manina.", "l'amore è n'calesse, se non te sbrighi a salì rimani a piedi.", "er lavoro te stressa ma i sordi, forse, arrivano.",
            "meglio che te stai zitto oggi, che ogni parola è na condanna.", "fai er bravo, che er karma te guarda.", "hai la testa dura come i sampietrini de Piazza Venezia.", "te senti solo come n'gabbiano ar Gianicolo.",
            "c'hai n'energia che potresti illuminà er Raccordo Anulare.", "la gente te cerca, ma tu voj solo stà sul divano.", "occhio a chi te sorride, che magari vole solo scroccà er caffè.", "l'amore oggi è come la metro C: non se sa quando arriva.",
            "oggi sei acido come lo yogurt scaduto, fatte na risata.", "sei dolce come er maritozzo, ma occhio alla glicemia.", "c'hai più dubbi te che Amleto in fila alle poste.", "te senti un gladiatore, ma stai attento ai leoni.",
            "oggi n'te va bene niente, manco se te regalano i sordi.", "sei confuso come n'turista a Termini.", "c'hai na voglia de lavorà che saltame addosso.", "er partner te sta a studià, vedi de non fallì l'esame.",
            `essendo de ${element}, oggi bruci come l'asfalto d'agosto.`, `visto che sei de ${element}, te senti fluido ma occhio a non scivolà.`, `col tuo segno ${element}, oggi voli alto ma attento ai piccioni.`, `da bravo segno de ${element}, sei concreto come n'mattone forato.`,
            "oggi c'hai la luna storta e er sole pure peggio.", "se pensi de avè ragione, ricordate che pure i matti so convinti.", "fai pace cor cervello prima de parlà.", "l'opportunità bussa, ma tu stavi in bagno.",
            "c'è n'aria de cambiamento, o forse hai solo lasciato la finestra aperta.", "te senti n'po' poeta e n'po' muratore oggi.", "la fortuna te gira intorno, acchiappala ar volo.", "oggi sei magnetico, attiri pure le multe.",

            "te senti n'po' Sora Lella e n'po' Verdone.", "la giornata promette bene, mantieni la calma e gesso.", "se ridi oggi, ridi domani, ridi sempre.", "oggi er core tuo batte forte, sarà amore o tachicardia?",
            "hai bisogno de n'abbraccio o de n'bonifico, decidi te.", "la creatività te scorre nelle vene tipo vino.", "oggi risolvi tutto co n'alzata de spalle.", "sei testardo ma c'hai n'core grande così.",

            "sei n'mistero pure pe te stesso oggi.", "la tua simpatia oggi è contagiosa, tipo influenza."
          ];

          const outros = [
            "Daje tutta!", "E se va male... c'è sempre la Carbonara.", "Volemose bene, che la vita è corta.", "Fusse che fusse la vorta bbona!", "Forza e coraggio, che er male è di passaggio.",
            "Bona, ho detto tutto.", "Mo vedi tu che devi fa.", "E ricordate: chi se fa li fatti sua campa cent'anni.", "Daje, che domani è n'artro giorno.", "Stacce.",
            "E non te scordà de soride.", "Vai e spacca tutto (metaforicamente eh).", "Speramo bene.", "Vattelapesca.", "E come diceva er nonno: magna e fregatene.",
            "Pija la vita come viene.", "Sei forte, ricordatelo.", "Mò statte bono.", "Chiudi l'occhi e spera.", "Arrivederci e grazie.",

          ];

          const i1 = seed % intros.length;
          const i2 = (seed * 7 + 13) % middles.length; 
          const i3 = (seed * 3 + 7) % outros.length;
          const foodIndex = (seed * 17) % foods.length;
          const moodIndex = (seed * 23) % moods.length;

          const n1 = (seed % 90) + 1;
          const n2 = ((seed * 5) % 90) + 1;
          const n3 = ((seed * 11) % 90) + 1;

          return {
            text: `${intros[i1]} ${middles[i2]} ${outros[i3]}`,
            stats: stats,
            food: foods[foodIndex],
            numbers: [n1, n2, n3],
            mood: moods[moodIndex]
          };
        };

        const StarField = ({ theme }) => {
          const stars = useMemo(() => {
            return [...Array(60)].map((_, i) => ({
              top: `${Math.random() * 100}%`,
              left: `${Math.random() * 100}%`,
              width: `${Math.random() * 3 + 1}px`,
              height: `${Math.random() * 3 + 1}px`,
              animationDuration: `${Math.random() * 3 + 1}s`,
              animationDelay: `${Math.random() * 2}s`
            }));
          }, []);

          // Colore stelle basato sul tema
          const starClass = theme === 'dark' 
            ? 'bg-white shadow-[0_0_2px_#fff]' 
            : 'bg-yellow-500 shadow-[0_0_2px_#fbbf24]';

          return (
            <div className={`fixed inset-0 z-0 pointer-events-none overflow-hidden theme-transition ${theme === 'dark' ? 'bg-slate-950' : 'bg-orange-50'}`}>
              <div className={`absolute inset-0 bg-gradient-to-b ${theme === 'dark' ? 'from-slate-950 via-indigo-950/20 to-slate-950' : 'from-orange-50 via-yellow-100/30 to-orange-50'}`}></div>
              {stars.map((star, i) => (
                <div
                  key={i}
                  className={`absolute rounded-full opacity-60 animate-pulse ${starClass} theme-transition`}
                  style={star}
                />
              ))}
            </div>
          );
        };

        const Logo = () => (
          <div className="relative group cursor-pointer">
            <div className="absolute inset-0 bg-orange-500 blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-500 rounded-full"></div>
            <div className="relative bg-gradient-to-br from-yellow-400 to-orange-600 p-3 rounded-2xl shadow-xl shadow-orange-500/20 transform transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3">

                <div className="absolute inset-0 flex items-center justify-center">
                     <span className="text-xs md:text-sm font-black text-orange-900 animate-pulse">AV</span>
                </div>
              </div>

            <div className="absolute -top-1 -right-1 w-3 h-3 bg-cyan-400 rounded-full border-2 border-slate-950 animate-bounce"></div>
          </div>
        );

        const Header = ({ savedSign, onOpenSaved, theme, toggleTheme }) => {
            const generateSubtitle = () => {
                const partsA = [
                    "L'Astri vostri", "L'oroscopo de Roma", "Er destino tuo", "Le stelle parlano", "Gigi te dice", 
                    "La verità", "Er cielo sopra Roma", "Le previsioni", "Er cosmo", "Tutto quello che c'è da sapè",
                    "La saggezza antica", "Er futuro", "Quello che t'aspetta", "Le carte dicono", "Sopra ar Cuppolone"
                ];
                const partsB = [
                    "e di chi ve li manna", "senza peli sulla lingua", "più verace de la carbonara", "scritto sui sampietrini",
                    "che non ce gira intorno", "tra un supplì e na birra", "che manco tu madre", "co la benedizione daa Lupa",
                    "che te guarda e te giudica", "senza filtri né inganni", "che non fa sconti", "più schietto de n'oste",
                    "che te legge dentro", "che ne sa una più der diavolo", "co la precisione der traffico"
                ];
                const partsC = [
                    ", e stacce.", ", pane ar pane, vino ar vino.", ", alla faccia de la sfiga.", ", pure se Saturno rosica.",
                    ", e se non te piace, ciao.", ", garantito ar limone.", ", e bona notte ai sonatori.", ", cor core in mano.",
                    ", e daje tutta.", ", e speramo bene.", ", e chi s'è visto s'è visto.", ", parola de Gigi.",
                    ", e mo so cavoli tui.", ", come te pare a te.", ", e volemose bene."
                ];

                const rA = partsA[Math.floor(Math.random() * partsA.length)];
                const rB = partsB[Math.floor(Math.random() * partsB.length)];
                const rC = partsC[Math.floor(Math.random() * partsC.length)];

                return `${rA} ${rB}${rC}`;
            };

            const [subtitle, setSubtitle] = useState("");

            useEffect(() => {
                setSubtitle(generateSubtitle());
            }, []);

            return (
              <nav className={`relative z-10 flex flex-col md:flex-row justify-between items-center p-4 md:p-6 border-b backdrop-blur-md sticky top-0 shadow-lg gap-4 md:gap-0 transition-all theme-transition ${theme === 'dark' ? 'bg-slate-950/80 border-white/5' : 'bg-orange-50/80 border-orange-200'}`}>
                <div className="flex items-center gap-4">
                  <Logo />
                  <div className="text-left">
                    <h1 className="text-2xl md:text-3xl font-black italic bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 via-orange-500 to-red-600 tracking-tighter leading-none filter drop-shadow-sm">
                      AstriVostri
                    </h1>
                    <p className={`text-[10px] md:text-xs font-bold uppercase tracking-widest mt-1 theme-transition ${theme === 'dark' ? 'text-orange-200/70' : 'text-orange-800/70'}`}>
                      {subtitle}
                    </p>
                  </div>
                </div>
                
                <div className="flex items-center gap-4">
                  {savedSign && (
                    <button 
                      onClick={onOpenSaved}
                      className={`group flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold transition-all border shadow-sm theme-transition ${theme === 'dark' ? 'bg-white/5 hover:bg-white/10 text-slate-300 border-white/5' : 'bg-white hover:bg-orange-100 text-slate-700 border-orange-200'}`}
                    >
                      <div className="bg-yellow-500/20 p-1 rounded-full group-hover:bg-yellow-500/40 transition-colors">
                         <User size={12} />
                      </div>
                      <span>{savedSign}</span>
                    </button>
                  )}
                  <button 
                    onClick={toggleTheme}
                    className={`p-2 rounded-full transition-all border shadow-sm theme-transition ${theme === 'dark' ? 'bg-slate-800 text-yellow-400 border-slate-700 hover:bg-slate-700' : 'bg-white text-slate-600 border-orange-200 hover:bg-orange-100'}`}
                    title={theme === 'dark' ? "Passa al tema chiaro" : "Passa al tema scuro"}
                  >
                    {theme === 'dark' ? <Sun size={20} /> : <Moon size={20} />}
                  </button>
                </div>
              </nav>
            );
        };

        const CookieBanner = ({ theme }) => {
          const [isVisible, setIsVisible] = useState(false);

          useEffect(() => {
            const accepted = localStorage.getItem('cookieAccepted');
            if (!accepted) {
              const timer = setTimeout(() => setIsVisible(true), 1500);
              return () => clearTimeout(timer);
            }
          }, []);

          const acceptCookies = () => {
            localStorage.setItem('cookieAccepted', 'true');
            setIsVisible(false);
          };

          if (!isVisible) return null;

          return (
            <div className="fixed bottom-0 left-0 right-0 z-50 p-4 animate-in slide-in-from-bottom-full duration-500">
              <div className={`max-w-4xl mx-auto backdrop-blur-md border rounded-2xl p-4 md:p-6 shadow-2xl flex flex-col md:flex-row items-center gap-4 md:gap-8 theme-transition ${theme === 'dark' ? 'bg-slate-900/95 border-yellow-500/30 shadow-black' : 'bg-white/95 border-orange-200 shadow-orange-900/20'}`}>
                <div className="bg-yellow-500/20 p-3 rounded-full shrink-0 animate-bounce">
                  <Cookie className="w-8 h-8 text-yellow-500" />
                </div>
                <div className="flex-grow text-center md:text-left">
                  <h4 className={`font-bold text-lg mb-1 theme-transition ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>Aò, i biscotti! (Cookies)</h4>
                  <p className={`text-xs md:text-sm leading-relaxed theme-transition ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                    Usamo i cookie solo pe' salvà er segno tuo e er tema (chiaro/scuro), così nun devi cliccà ogni volta. Niente tracciamenti strani, niente spie, giuro su mi madre.
                  </p>
                </div>
                <div className="flex gap-3 w-full md:w-auto shrink-0">
                   <button 
                     onClick={acceptCookies}
                     className="flex-1 md:flex-none bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-6 rounded-xl transition-all shadow-lg transform active:scale-95"
                   >
                     Me fido, Daje
                   </button>
                </div>
              </div>
            </div>
          );
        };

        const Ranking = ({ theme }) => {
          const ranking = useMemo(() => generateRanking(), []);
          
          return (
            <div className="max-w-md mx-auto mb-12 px-4">
              <div className={`border rounded-2xl p-5 backdrop-blur-sm relative overflow-hidden theme-transition ${theme === 'dark' ? 'bg-slate-900/80 border-yellow-500/20' : 'bg-white/60 border-orange-200'}`}>
                <div className="absolute -right-10 -top-10 w-32 h-32 bg-yellow-500/5 rounded-full blur-2xl"></div>
                
                <div className="flex items-center justify-center gap-2 mb-5 font-black uppercase tracking-widest text-xs relative z-10 theme-transition text-yellow-500">
                  <Trophy size={14} />
                  <span>La Classifica de Oggi</span>
                </div>
                
                <div className="space-y-3 relative z-10">
                  {/* Top 1 */}
                  <div className={`flex items-center justify-between bg-gradient-to-r p-3 rounded-xl border-l-4 border-yellow-500 shadow-lg transition-transform hover:scale-[1.02] theme-transition ${theme === 'dark' ? 'from-yellow-500/20 to-transparent shadow-yellow-900/10' : 'from-yellow-100 to-transparent shadow-orange-200/50'}`}>
                    <div className="flex items-center gap-3">
                      <div className="bg-yellow-500 text-slate-900 w-6 h-6 rounded-full flex items-center justify-center font-black text-xs">1</div>
                      <span className={`font-bold text-lg theme-transition ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>{ranking[0].name}</span>
                    </div>
                    <ArrowUp size={20} className="text-green-500 animate-bounce" />
                  </div>

                  {/* Top 2 */}
                  <div className={`flex items-center justify-between p-2 rounded-lg border-l-4 border-slate-400 transition-colors theme-transition ${theme === 'dark' ? 'bg-white/5 hover:bg-white/10' : 'bg-white hover:bg-slate-50 border-slate-300'}`}>
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-bold text-slate-400 w-6 text-center">2</span>
                      <span className={`font-medium theme-transition ${theme === 'dark' ? 'text-slate-200' : 'text-slate-700'}`}>{ranking[1].name}</span>
                    </div>
                  </div>

                   {/* Top 3 */}
                   <div className={`flex items-center justify-between p-2 rounded-lg border-l-4 border-orange-700 transition-colors theme-transition ${theme === 'dark' ? 'bg-white/5 hover:bg-white/10' : 'bg-white hover:bg-orange-50 border-orange-300'}`}>
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-bold text-orange-700 w-6 text-center">3</span>
                      <span className={`font-medium theme-transition ${theme === 'dark' ? 'text-slate-200' : 'text-slate-700'}`}>{ranking[2].name}</span>
                    </div>
                  </div>

                  <div className="text-center text-[10px] text-slate-500 pt-2 font-medium flex items-center justify-center gap-1">
                     ...e ultimo posto pe' <strong className="text-red-500">{ranking[ranking.length - 1].name}</strong> <ArrowDown size={12} className="text-red-500"/>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const Hero = ({ theme }) => {
          const today = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
          const [phrase, setPhrase] = useState("");

          useEffect(() => {
            const heroPhrases = [
                "Sceji er segno tuo. Senza giri de parole, pane ar pane e vino ar vino.",
                "Clicca sur segno tuo e scopri se oggi devi ride o devi piagne.",
                "Non è vero ma ce credo. O forse sì. Vabbè, tu clicca.",
                "L'unico oroscopo che non te manna a dì. Schietto e sincero.",
                "Sei pronto a sentì la verità? O preferisci le bugie de l'altri?",
                "Daje, sbrigati a cliccà che le stelle non aspettano nessuno.",
                "Er destino è scritto, ma noi glie damo n'occhiata prima.",
                "Oggi le stelle c'hanno la luna storta o te sorridono? Scoprilo.",
                "Mettite comodo, pjate 'n caffè e leggi che t'ho preparato.",
                "Nessun algoritmo, solo pura saggezza (e un po' de fortuna)."
            ];
            setPhrase(heroPhrases[Math.floor(Math.random() * heroPhrases.length)]);
          }, []);
          
          return (
            <div className="relative z-10 text-center py-10 md:py-16 px-4">
              <div className={`inline-flex items-center gap-2 px-5 py-2 rounded-full border text-xs font-bold mb-8 shadow-2xl uppercase tracking-wider backdrop-blur-md transform hover:scale-105 transition-transform cursor-default theme-transition ${theme === 'dark' ? 'bg-slate-800/80 border-slate-700 text-slate-300' : 'bg-white/80 border-orange-200 text-slate-600'}`}>
                <Calendar size={14} className="text-yellow-500" />
                <span className="capitalize">{today}</span>
              </div>
              <h1 className="text-5xl md:text-8xl font-black mb-6 tracking-tight drop-shadow-2xl theme-transition text-transparent bg-clip-text bg-gradient-to-tr from-yellow-400 to-orange-600">
                AstriVostri<span className={theme === 'dark' ? 'text-white' : 'text-slate-800'}>.com</span>
              </h1>
              <p className={`text-lg md:text-2xl max-w-2xl mx-auto mb-10 font-medium italic px-4 leading-relaxed theme-transition ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>
                "{phrase}"
              </p>
            </div>
          );
        };

        const HoroscopeModal = ({ sign, isOpen, onClose, theme }) => {
          const [loading, setLoading] = useState(true);
          const [data, setData] = useState(null);
          const [progress, setProgress] = useState(0);
          const [copied, setCopied] = useState(false);
          const [loadingText, setLoadingText] = useState("");

          const loadingPhrases = [
            "Sto a chiede a Sora Lella...",
            "Sto a sentì Albertone...",
            "Mandrake sta a mischià le carte...",
            "Giulio Cesare sta a riflette...",
            "Nerone sta a accenne er foco...",
            "Sto a consultà l'antichi...",
            "Er Papa sta a guardà le stelle...",
            "Sto a chiamà er Gladiatore..."
          ];

          useEffect(() => {
            if (isOpen) {
              setLoading(true);
              setProgress(0);
              setData(null);
              setCopied(false);
              setLoadingText(loadingPhrases[0]);

              localStorage.setItem('savedSignId', sign.id);

              let phraseIndex = 0;
              const textInterval = setInterval(() => {
                phraseIndex = (phraseIndex + 1) % loadingPhrases.length;
                setLoadingText(loadingPhrases[phraseIndex]);
              }, 800);

              const interval = setInterval(() => {
                setProgress(prev => {
                  if (prev >= 100) {
                    clearInterval(interval);
                    clearInterval(textInterval);
                    return 100;
                  }
                  return prev + 4;
                });
              }, 80);

              setTimeout(() => {
                setData(generateRomanHoroscope(sign, sign.element));
                setLoading(false);
              }, 2500);

              return () => {
                clearInterval(interval);
                clearInterval(textInterval);
              };
            }
          }, [isOpen, sign]);

          const handleShare = async () => {
            if (!data) return;

            const shareText = `🔥 OROSCOPO ROMANO de GIGI 🔥\n\n${sign.name} ♈\n"${data.text}"\n\nmood: ${data.mood.icon} ${data.mood.label}\nmagna: 🍝 ${data.food}\nnumeri: 🍀 ${data.numbers.join('-')}\n\n👉 Leggi er tuo su AstriVostri.com\n#AstriVostri #OroscopoRomano #Daje`;
            const shareUrl = 'https://astrivostri.com';

            // 1. Prova Web Share API (Mobile: WhatsApp, Instagram, etc.)
            if (navigator.share) {
              try {
                await navigator.share({
                  title: 'AstriVostri - Oroscopo Romano',
                  text: shareText,
                  url: shareUrl,
                });
                return; // Se ha funzionato, usciamo
              } catch (err) {
                console.log('Errore Web Share, provo clipboard:', err);
                // Se l'utente annulla o fallisce, proviamo la clipboard
              }
            }

            // 2. Fallback: Clipboard API (Modern Desktop)
            try {
                await navigator.clipboard.writeText(shareText);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            } catch (err) {
                // 3. Fallback estremo: Textarea nascosta (Vecchio stile ma funziona sempre)
                const textArea = document.createElement("textarea");
                textArea.value = shareText;
                
                // Assicura che l'elemento sia parte del DOM ma non visibile
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                
                textArea.focus();
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) {
                    console.error('Manco co la forza:', e);
                    alert("Aò, nun riesco a copià. Falla a mano!");
                }
                
                document.body.removeChild(textArea);
            }
          };

          if (!isOpen || !sign) return null;

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md animate-in fade-in duration-300" onClick={onClose} />
              
              <div className={`relative w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-300 theme-transition border ${theme === 'dark' ? 'bg-slate-900 border-slate-700 shadow-yellow-900/20' : 'bg-orange-50 border-orange-200 shadow-orange-900/20'}`}>
                
                {/* Header Modale */}
                <div className={`p-5 flex justify-between items-center border-b shrink-0 theme-transition ${theme === 'dark' ? 'bg-slate-800/50 border-white/5' : 'bg-white/50 border-orange-200'}`}>
                  <div className="flex items-center gap-4">
                    <div className={`p-3 rounded-2xl bg-gradient-to-br shadow-inner ${
                      sign.element === 'Fuoco' ? 'from-orange-500 to-red-600' :
                      sign.element === 'Acqua' ? 'from-blue-500 to-cyan-600' :
                      sign.element === 'Aria' ? 'from-indigo-400 to-purple-500' :
                      'from-emerald-500 to-green-600'
                    }`}>
                      <Sun className="w-8 h-8 text-white" />
                    </div>
                    <div>
                      <h3 className={`text-2xl font-black tracking-wide uppercase theme-transition ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>{sign.name}</h3>
                      <p className={`text-sm font-medium theme-transition ${theme === 'dark' ? 'text-slate-400' : 'text-slate-500'}`}>{sign.dates}</p>
                    </div>
                  </div>
                  <button onClick={onClose} className={`transition-colors p-2 rounded-full theme-transition ${theme === 'dark' ? 'text-slate-400 hover:text-white bg-white/5 hover:bg-white/10' : 'text-slate-500 hover:text-slate-800 bg-black/5 hover:bg-black/10'}`}>
                    <X size={24} />
                  </button>
                </div>

                {/* Content */}
                <div className={`p-6 md:p-8 overflow-y-auto custom-scrollbar flex-grow relative theme-transition ${theme === 'dark' ? 'bg-slate-900' : 'bg-orange-50'}`}>
                  
                  <div className="absolute top-0 right-0 w-64 h-64 bg-yellow-500/5 rounded-full blur-3xl pointer-events-none -translate-y-1/2 translate-x-1/2"></div>

                  {loading ? (
                    <div className="text-center space-y-8 py-12 flex flex-col items-center justify-center h-full">
                      <div className="relative">
                        <Moon className="w-16 h-16 text-yellow-500 mx-auto animate-bounce" />
                        <Sparkles className={`w-6 h-6 absolute -top-2 -right-2 animate-pulse ${theme === 'dark' ? 'text-white' : 'text-orange-500'}`} />
                      </div>
                      <div className="space-y-4 w-full max-w-xs">
                        <p className="text-yellow-500 font-bold text-lg animate-pulse min-h-[1.75rem]">{loadingText}</p>
                        <div className={`w-full h-2 rounded-full overflow-hidden border ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-orange-100 border-orange-200'}`}>
                          <div 
                            className="h-full bg-gradient-to-r from-yellow-600 to-yellow-400 transition-all duration-300 ease-out"
                            style={{ width: `${progress}%` }}
                          />
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-6 animate-in fade-in slide-in-from-bottom-6 duration-500 relative z-10">
                      
                      {/* Mood Badge */}
                      <div className="flex justify-center">
                         <div className={`border px-5 py-2 rounded-full flex items-center gap-4 shadow-lg transform hover:scale-105 transition-transform cursor-default theme-transition ${theme === 'dark' ? 'bg-slate-800 border-yellow-500/30 shadow-black/40' : 'bg-white border-orange-200 shadow-orange-900/10'}`}>
                            <span className="text-4xl filter drop-shadow-md">{data.mood.icon}</span>
                            <div className="flex flex-col text-left">
                               <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Mood de Oggi</span>
                               <span className={`text-base font-black ${theme === 'dark' ? 'text-yellow-400' : 'text-orange-600'}`}>{data.mood.label}</span>
                            </div>
                         </div>
                      </div>

                      {/* Oroscopo Text */}
                      <div className={`p-6 rounded-2xl border relative group transition-colors theme-transition ${theme === 'dark' ? 'bg-slate-800/40 border-white/5 hover:bg-slate-800/60' : 'bg-white border-orange-100 shadow-sm hover:shadow-md'}`}>
                          <span className={`absolute top-2 left-3 text-5xl font-serif transition-colors ${theme === 'dark' ? 'text-white/5 group-hover:text-white/10' : 'text-orange-900/5 group-hover:text-orange-900/10'}`}>"</span>
                          <p className={`text-xl leading-relaxed font-medium text-center italic drop-shadow-sm relative z-10 px-2 theme-transition ${theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}`}>
                            {data.text}
                          </p>
                          <span className={`absolute bottom-0 right-4 text-5xl font-serif transition-colors ${theme === 'dark' ? 'text-white/5 group-hover:text-white/10' : 'text-orange-900/5 group-hover:text-orange-900/10'}`}>"</span>
                      </div>

                      {/* Stats Grid */}
                      <div className="grid grid-cols-3 gap-3">
                        <div className={`text-center p-3 rounded-xl border theme-transition ${theme === 'dark' ? 'bg-slate-800/40 border-white/5' : 'bg-white border-orange-100 shadow-sm'}`}>
                          <div className="text-2xl font-black text-red-500">{data.stats.love}%</div>
                          <div className="text-[10px] text-slate-500 uppercase font-bold tracking-wider mt-1">Amore</div>
                        </div>
                        <div className={`text-center p-3 rounded-xl border theme-transition ${theme === 'dark' ? 'bg-slate-800/40 border-white/5' : 'bg-white border-orange-100 shadow-sm'}`}>
                          <div className="text-2xl font-black text-blue-500">{data.stats.work}%</div>
                          <div className="text-[10px] text-slate-500 uppercase font-bold tracking-wider mt-1">Sordi</div>
                        </div>
                        <div className={`text-center p-3 rounded-xl border theme-transition ${theme === 'dark' ? 'bg-slate-800/40 border-white/5' : 'bg-white border-orange-100 shadow-sm'}`}>
                          <div className="text-2xl font-black text-green-500">{data.stats.luck}%</div>
                          <div className="text-[10px] text-slate-500 uppercase font-bold tracking-wider mt-1">Culo</div>
                        </div>
                      </div>

                      {/* Cibo e Numeri */}
                      <div className="grid grid-cols-2 gap-3">
                        <div className={`p-4 rounded-xl border flex flex-col items-center text-center justify-center transition-colors theme-transition ${theme === 'dark' ? 'bg-slate-800/40 border-white/5 hover:bg-slate-800/60' : 'bg-white border-orange-100 shadow-sm hover:shadow-md'}`}>
                          <div className="flex items-center gap-2 mb-2 text-orange-500">
                            <Utensils size={16} />
                            <span className="text-[10px] font-bold uppercase tracking-wider">Er Piatto</span>
                          </div>
                          <p className={`text-sm font-bold leading-tight theme-transition ${theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}`}>{data.food}</p>
                        </div>
                        <div className={`p-4 rounded-xl border flex flex-col items-center text-center justify-center transition-colors theme-transition ${theme === 'dark' ? 'bg-slate-800/40 border-white/5 hover:bg-slate-800/60' : 'bg-white border-orange-100 shadow-sm hover:shadow-md'}`}>
                          <div className="flex items-center gap-2 mb-2 text-yellow-500">
                            <Dices size={16} />
                            <span className="text-[10px] font-bold uppercase tracking-wider">I Numeri</span>
                          </div>
                          <div className={`flex gap-2 text-base font-black ${theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}`}>
                            {data.numbers.map(n => (
                              <span key={n} className={`w-7 h-7 rounded-full flex items-center justify-center text-xs border ${theme === 'dark' ? 'bg-white/10 border-white/5' : 'bg-orange-100 text-orange-800 border-orange-200'}`}>{n}</span>
                            ))}
                          </div>
                        </div>
                      </div>

                      <button 
                        onClick={handleShare}
                        className={`w-full font-bold py-4 rounded-xl flex items-center justify-center gap-3 transition-all transform hover:scale-[1.01] shadow-lg active:scale-95 ${copied ? 'bg-green-600 text-white' : 'bg-yellow-500 hover:bg-yellow-400 text-slate-900 border border-yellow-600/20'}`}
                      >
                        {copied ? <Check size={20} /> : <Share2 size={20} />}
                        <span>{copied ? "Testo Copiato!" : "Condividi co l'amici"}</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        const ZodiacCard = ({ sign, onClick, theme }) => (
          <div 
            onClick={() => onClick(sign)}
            className={`group relative border rounded-3xl p-6 cursor-pointer transition-all duration-300 hover:transform hover:-translate-y-2 hover:shadow-2xl overflow-hidden flex flex-col items-center active:scale-95 theme-transition ${theme === 'dark' ? 'bg-slate-900 border-slate-800 hover:border-yellow-500/50 hover:shadow-yellow-500/10' : 'bg-white border-orange-100 hover:border-orange-300 hover:shadow-orange-500/20 shadow-sm'}`}
          >
            <div className={`absolute inset-0 bg-gradient-to-br transition-all duration-500 ${theme === 'dark' ? 'from-yellow-500/0 via-transparent to-purple-500/0 group-hover:from-yellow-500/5 group-hover:to-purple-500/5' : 'from-orange-200/0 via-transparent to-yellow-200/0 group-hover:from-orange-100/50 group-hover:to-yellow-100/50'}`} />
            
            <div className="relative z-10 flex flex-col items-center text-center">
              <div className={`w-16 h-16 mb-4 rounded-full flex items-center justify-center transition-colors border shadow-inner relative theme-transition ${theme === 'dark' ? 'bg-slate-950 group-hover:bg-slate-900 border-slate-800 group-hover:border-yellow-500/30' : 'bg-orange-50 group-hover:bg-white border-orange-100 group-hover:border-orange-200'}`}>
                 <div className={`absolute inset-0 rounded-full blur-md opacity-0 group-hover:opacity-100 transition-opacity ${theme === 'dark' ? 'bg-white/5' : 'bg-orange-200/20'}`} />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className={`w-8 h-8 transition-colors relative z-10 transform group-hover:scale-110 duration-300 theme-transition ${theme === 'dark' ? 'text-slate-400 group-hover:text-yellow-400' : 'text-slate-500 group-hover:text-orange-500'}`}>
                  <path d={sign.icon} />
                </svg>
              </div>
              
              <h3 className={`text-lg font-black transition-colors tracking-tight theme-transition ${theme === 'dark' ? 'text-slate-100 group-hover:text-yellow-400' : 'text-slate-800 group-hover:text-orange-600'}`}>{sign.name}</h3>
              <p className={`text-[10px] mb-3 font-medium uppercase tracking-wide theme-transition ${theme === 'dark' ? 'text-slate-500' : 'text-slate-400'}`}>{sign.dates}</p>
              
              <span className={`px-2 py-1 rounded-lg text-[10px] font-bold tracking-widest uppercase border ${
                sign.element === 'Fuoco' ? 'border-red-500/30 text-red-500 bg-red-500/10' :
                sign.element === 'Acqua' ? 'border-blue-500/30 text-blue-500 bg-blue-500/10' :
                sign.element === 'Aria' ? 'border-indigo-500/30 text-indigo-500 bg-indigo-500/10' :
                'border-emerald-500/30 text-emerald-500 bg-emerald-500/10'
              }`}>
                {sign.element}
              </span>
            </div>
          </div>
        );

        const App = () => {
          const [selectedSign, setSelectedSign] = useState(null);
          const [savedSignName, setSavedSignName] = useState(null);
          const [theme, setTheme] = useState('dark');

          useEffect(() => {
            // Check localStorage for saved sign
            const savedId = localStorage.getItem('savedSignId');
            if (savedId) {
              const sign = zodiacData.find(s => s.id === savedId);
              if (sign) setSavedSignName(sign.name);
            }

            // Check localStorage for theme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
              setTheme(savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
              // Optional: Auto-detect system preference
              // setTheme('light'); 
            }
          }, [selectedSign]); 

          const handleOpenSaved = () => {
            const savedId = localStorage.getItem('savedSignId');
            const sign = zodiacData.find(s => s.id === savedId);
            if (sign) setSelectedSign(sign);
          };

          const toggleTheme = () => {
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('theme', newTheme);
          };

          return (
            <div className={`min-h-screen font-sans selection:bg-yellow-500/30 theme-transition ${theme === 'dark' ? 'bg-slate-950 text-slate-200' : 'bg-orange-50 text-slate-800'}`}>
              <StarField theme={theme} />
              
              <Header 
                savedSign={savedSignName} 
                onOpenSaved={handleOpenSaved} 
                theme={theme}
                toggleTheme={toggleTheme}
              />
              
              <main className="container mx-auto pb-24 relative z-10">
                <Hero theme={theme} />
                <Ranking theme={theme} />
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 px-4 md:px-0 max-w-6xl mx-auto">
                  {zodiacData.map((sign) => (
                    <ZodiacCard 
                      key={sign.id} 
                      sign={sign} 
                      onClick={setSelectedSign} 
                      theme={theme}
                    />
                  ))}
                </div>
              </main>

              <footer className={`relative z-10 border-t py-12 theme-transition ${theme === 'dark' ? 'border-white/5 bg-slate-950' : 'border-orange-200 bg-orange-50'}`}>
                <div className="container mx-auto px-4 text-center">
                  <div className="flex items-center justify-center gap-3 mb-6">
                     <div className="animate-spin-slow">
                       <Sun className="w-5 h-5 text-yellow-500" />
                     </div>
                     <span className={`font-black text-lg italic theme-transition ${theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}`}>AstriVostri.com</span>
                  </div>
                  <p className={`text-xs max-w-md mx-auto leading-relaxed theme-transition ${theme === 'dark' ? 'text-slate-600' : 'text-slate-500'}`}>
                    © 2024 AstriVostri. Oroscopo satirico per farsi due risate. Se le stelle non so' d'accordo, prenditela co' loro e co' chi ve li manna.
                  </p>
                </div>
              </footer>

              <CookieBanner theme={theme} />
              <HoroscopeModal 
                sign={selectedSign} 
                isOpen={!!selectedSign} 
                onClose={() => setSelectedSign(null)} 
                theme={theme}
              />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
