        const zodiacIcons = {
          ariete: "M12 21a9 9 0 0 0 9-9h-9v9Zm0-9V3a9 9 0 0 0-9 9h9Zm0 0V7.5c0-1.5 3-4.5 4.5-4.5S21 6 21 7.5c0 3-4.5 4.5-4.5 4.5H12Zm0 0V7.5C12 6 9 3 7.5 3S3 6 3 7.5c0 3 4.5 4.5 4.5 4.5H12Z", 
          toro: "M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M12 12V6m-5-2a5 5 0 0 1 10 0",
          gemelli: "M9 3v18M15 3v18M6 3h12M6 21h12",
          cancro: "M6 12a6 6 0 1 0 12 0 6 6 0 1 0-12 0m0 0a6 6 0 1 1-12 0 6 6 0 1 1 12 0",

          vergine: "M4 4v16M4 12h4m0 0v8m0-8h4m0 0v8m0-4h4v4", 
          bilancia: "M4 18h16M4 14h16M12 6c3 0 5 4 5 8H7c0-4 2-8 5-8",
          scorpione: "M4 4v16M4 12h4m0 0v8m0-8h4m0 0v8m0-4h4v4l2 2", 
          sagittario: "M5 19l14-14M19 5v8M19 5h-8M5 19l4 4", 
          capricorno: "M4 6c0 4 2 6 5 6s4-4 4-8 4 6 4 10a4 4 0 1 1-8 0", 
          acquario: "M3 10c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 16c2-2 4-2 6 0s4 2 6 0 4-2 6 0", 
          pesci: "M12 3c-4 4-4 14 0 18M12 3c4 4 4 14 0 18M5 12h14"
        };

        const zodiacData = [
          { id: 'ariete', name: 'Ariete', dates: '21 Mar - 19 Apr', element: 'Fuoco', icon: zodiacIcons.ariete },
          { id: 'toro', name: 'Toro', dates: '20 Apr - 20 Mag', element: 'Terra', icon: zodiacIcons.toro },
          { id: 'gemelli', name: 'Gemelli', dates: '21 Mag - 20 Giu', element: 'Aria', icon: zodiacIcons.gemelli },
          { id: 'cancro', name: 'Cancro', dates: '21 Giu - 22 Lug', element: 'Acqua', icon: zodiacIcons.cancro },
          { id: 'leone', name: 'Leone', dates: '23 Lug - 22 Ago', element: 'Fuoco', icon: zodiacIcons.leone },
          { id: 'vergine', name: 'Vergine', dates: '23 Ago - 22 Set', element: 'Terra', icon: zodiacIcons.vergine },
          { id: 'bilancia', name: 'Bilancia', dates: '23 Set - 22 Ott', element: 'Aria', icon: zodiacIcons.bilancia },
          { id: 'scorpione', name: 'Scorpione', dates: '23 Ott - 21 Nov', element: 'Acqua', icon: zodiacIcons.scorpione },
          { id: 'sagittario', name: 'Sagittario', dates: '22 Nov - 21 Dic', element: 'Fuoco', icon: zodiacIcons.sagittario },
          { id: 'capricorno', name: 'Capricorno', dates: '22 Dic - 19 Gen', element: 'Terra', icon: zodiacIcons.capricorno },
          { id: 'acquario', name: 'Acquario', dates: '20 Gen - 18 Feb', element: 'Aria', icon: zodiacIcons.acquario },
          { id: 'pesci', name: 'Pesci', dates: '19 Feb - 20 Mar', element: 'Acqua', icon: zodiacIcons.pesci },
        ];

        // --- Logica e Dati ---

        const getDailyRandom = (seedString) => {
          let hash = 0;
          for (let i = 0; i < seedString.length; i++) {
            const char = seedString.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
          }
          return Math.abs(hash);
        };

        const getDailyStats = (signId) => {
          const today = new Date().toISOString().slice(0, 10);
          const seed = getDailyRandom(today + signId);
          const love = (seed % 60) + 40;
          const work = ((seed * 7) % 60) + 30;
          const luck = ((seed * 13) % 60) + 20;
          const total = love + work + luck;
          return { love, work, luck, total };
        };

        const generateRanking = () => {
          const ranking = zodiacData.map(sign => {
            const stats = getDailyStats(sign.id);
            return { ...sign, score: stats.total };
          });
          return ranking.sort((a, b) => b.score - a.score);
        };

        const generateRomanHoroscope = (sign, element) => {
          const today = new Date().toISOString().slice(0, 10);
          const seed = getDailyRandom(today + sign.id);
          const stats = getDailyStats(sign.id);
          
          // --- VOCABOLARIO ESTESO ---
          const intros = [
            "Aò, stamme a sentì bene oggi:", "Allora, le carte dicono questo:", "Oggi butta in na maniera strana:", "Senti n'po' che t'aspetta:", "Dunque, la situazione è questa:",
            "Nun te vojo mette ansia, ma...", "Apri bene le orecchie:", "Te lo dico cor core in mano:", "Er cielo oggi parla chiaro:", "Manco a dillo, oggi è così:",
            "Se fossi in te, oggi starei attento:", "Guarda, l'astri oggi so' 'n po' brilli:", "Ho visto le stelle e m'hanno detto:", "Amico mio, oggi è 'na giornata particolare:", "Non so come dirtelo, ma:",
            "Oggi er destino t'ha preso di mira:", "Famo a capisse, oggi va così:", "Senti che roba oggi:", "Me sa che oggi te tocca remà:", "L'oroscopo tuo oggi è 'n film:",
            "Aho, svejate che le stelle so' già operative:", "Te sei alzato cor piede giusto? Speramo:", "Er monno gira, e tu giri co lui:", "Vedi de non fa casini oggi:", "Oggi c'hai Saturno che te guarda male:",
            "Giove t'ha mandato n'messaggio su WhatsApp:", "Venere t'ha bloccato, ma Marte te segue:", "Ascolta er consiglio der vecchio Gigi:", "Mettite seduto che te devo dì na cosa:", "Oggi è er giorno tuo... o forse no:",
            "Daje che oggi spacchi (o vieni spaccato):", "Er cielo sopra Roma dice che:", "Le costellazioni s'hanno fatto na riunione su de te:", "Oggi er karma t'ha messo 'n lista d'attesa:", "Senti 'sta profezia, fresca fresca:",
            "Nun te lamentà prima de sentì:", "Sei pronto? Allora senti qua:", "Oggi l'universo c'ha n'piano pe te:", "Forse era mejo se restavi a letto, ma vabbè:", "Oggi c'hai n'aura potente, pure troppo:",
            "Senti 'sto presagio romano:", "L'oracolo ha parlato (e ha ruttato):", "Stamme a sentì, che me pare importante:", "Oggi l'aria tira così:", "Nun fa quella faccia, senti qua:"
          ];

          const middles = [
            "te senti carico a pallettoni, pronto a sfonnà tutto.", "la pazienza te sta a salutà co la manina.", "l'amore è n'calesse, se non te sbrighi a salì rimani a piedi.", "er lavoro te stressa ma i sordi, forse, arrivano.",
            "meglio che te stai zitto oggi, che ogni parola è na condanna.", "fai er bravo, che er karma te guarda.", "hai la testa dura come i sampietrini de Piazza Venezia.", "te senti solo come n'gabbiano ar Gianicolo.",
            "c'hai n'energia che potresti illuminà er Raccordo Anulare.", "la gente te cerca, ma tu voj solo stà sul divano.", "occhio a chi te sorride, che magari vole solo scroccà er caffè.", "l'amore oggi è come la metro C: non se sa quando arriva.",
            "oggi sei acido come lo yogurt scaduto, fatte na risata.", "sei dolce come er maritozzo, ma occhio alla glicemia.", "c'hai più dubbi te che Amleto in fila alle poste.", "te senti un gladiatore, ma stai attento ai leoni.",
            "oggi n'te va bene niente, manco se te regalano i sordi.", "sei confuso come n'turista a Termini.", "c'hai na voglia de lavorà che saltame addosso.", "er partner te sta a studià, vedi de non fallì l'esame.",
            `essendo de ${element}, oggi bruci come l'asfalto d'agosto.`, `visto che sei de ${element}, te senti fluido ma occhio a non scivolà.`, `col tuo segno ${element}, oggi voli alto ma attento ai piccioni.`, `da bravo segno de ${element}, sei concreto come n'mattone forato.`,
            "oggi c'hai la luna storta e er sole pure peggio.", "se pensi de avè ragione, ricordate che pure i matti so convinti.", "fai pace cor cervello prima de parlà.", "l'opportunità bussa, ma tu stavi in bagno.",
            "c'è n'aria de cambiamento, o forse hai solo lasciato la finestra aperta.", "te senti n'po' poeta e n'po' muratore oggi.", "la fortuna te gira intorno, acchiappala ar volo.", "oggi sei magnetico, attiri pure le multe.",
            "se devi fa na scelta, tira la monetina che è mejo.", "non te fidà manco de te stesso oggi.", "c'hai er fascino de n'attore de Cinecittà.", "oggi sei più lento de l'autobus notturno.",
            "te senti n'po' Sora Lella e n'po' Verdone.", "la giornata promette bene, mantieni la calma e gesso.", "se ridi oggi, ridi domani, ridi sempre.", "oggi er core tuo batte forte, sarà amore o tachicardia?",
            "hai bisogno de n'abbraccio o de n'bonifico, decidi te.", "la creatività te scorre nelle vene tipo vino.", "oggi risolvi tutto co n'alzata de spalle.", "sei testardo ma c'hai n'core grande così.",
            "la vita è na ruota, e oggi te tocca stà sotto.", "ma che t'hanno fatto? Pari n'cero votivo.", "oggi splendi, ma ricordate gli occhiali da sole.", "l'amore te sorride, ma c'ha i denti sporchi de spinaci.",
            "sei n'mistero pure pe te stesso oggi.", "la tua simpatia oggi è contagiosa, tipo influenza.",
            "oggi pari na statua de marmo, freddo ma bello.", "l'ansia oggi te magna vivo, respira.", "c'hai la grinta de n'leone a dieta."
          ];

          const outros = [
            "Daje tutta!", "E se va male... c'è sempre la Carbonara.", "Volemose bene, che la vita è corta.", "Fusse che fusse la vorta bbona!", "Forza e coraggio, che er male è di passaggio.",
            "Bona, ho detto tutto.", "Mo vedi tu che devi fa.", "E ricordate: chi se fa li fatti sua campa cent'anni.", "Daje, che domani è n'artro giorno.", "Stacce.",
            "E non te scordà de soride.", "Vai e spacca tutto (metaforicamente eh).", "Speramo bene.", "Vattelapesca.", "E come diceva er nonno: magna e fregatene.",
            "Pija la vita come viene.", "Sei forte, ricordatelo.", "Mò statte bono.", "Chiudi l'occhi e spera.", "Arrivederci e grazie.",
            "Nun mollà manco de n'centimetro.", "A la prossima puntata.", "Che la forza (e la porchetta) sia con te.", "Statte accorto.", "Daje de tacco, daje de punta.",
            "E se caschi, rialzate e fai finta de niente.", "Ma che te lo dico a fa?", "Buona fortuna, ne hai bisogno.", "T'ho detto tutto, mo so cavoli tui.", "Ciao core.",
            "E mo vedi de non fa danni.", "Vai in pace.", "Passo e chiudo.", "Amen.", "Daje Roma Daje (sempre)."
          ];

          const advices = [
            "Lassa perde WhatsApp pe oggi, fai 'na chiamata vera.", "Oggi offri er caffè a n'amico, te porta bene.", "Se t'incazzi, conta fino a dieci... poi mannali a quel paese.", 
            "Fatte 'na passeggiata ar centro, te ripija l'anima.", "Evita de discute cor capo, faje 'sì sì' co la testa.", "Compra n'Gratta e Vinci, ma solo uno eh.",
            "Stasera niente Netflix, esci a respirà aria de Roma.", "Se vedi n'gatto nero, faje na carezza, so tutte cavolate.", "Mettite n'vestito che te piace, fatte bello pe te.",
            "Nun te fidà de chi te dice 'te chiamo io'.", "Chiama tu madre, che je fa piacere.", "Smetti de guardà er telefono a tavola.",

            "Guarda dove metti i piedi, che le buche so' tante.", "Nun te magnà le unghie, magnate na pizzetta.", "Fai pace co quello che t'ha fatto sbroccà ieri.",
            "Pija la vita con filosofia (romana).", "Ricordate che i problemi d'oggi domani so ricordi."
          ];

          const foods = [
            "Rigatoni alla Carbonara", "Tonnarelli Cacio e Pepe", "Bucatini all'Amatriciana", "Pasta alla Gricia", "Coda alla Vaccinara",
            "Abbacchio a scottadito", "Carciofi alla Giudia", "Trippa alla Romana", "Supplì al telefono", "Maritozzo con la panna",
            "Pizza e Mortazza", "Saltimbocca alla Romana", "Puntarelle con le alici", "Filetti di Baccalà fritti", "Pajata",
            "Vignarola (se è stagione)", "Pollo coi peperoni", "Gnocchi alla Romana", "Fave e Pecorino", "Crostata di Visciole",
            "Grattachecca", "Pizza Bianca (scrocchiarella)", "Porchetta di Ariccia", "Fagioli con le cotiche", "Pizzette rosse"
          ];

          const moods = [
            { icon: "🤯", label: "Esaurito" }, { icon: "🥳", label: "In Festa" }, { icon: "😴", label: "Abbioccato" }, { icon: "🤬", label: "Nerissimo" },
            { icon: "🤩", label: "Stellare" }, { icon: "🥶", label: "Ghiacciato" }, { icon: "🌶️", label: "Piccante" }, { icon: "💸", label: "Al verde" },
            { icon: "👀", label: "Guardingo" }, { icon: "🦁", label: "Leone" }, { icon: "🦄", label: "Magico" }, { icon: "🌪️", label: "Caotico" },
            { icon: "🔋", label: "Carico" }, { icon: "🪫", label: "Scarico" }, { icon: "🍝", label: "Affamato" }, { icon: "🍷", label: "'Mbriaco" }
          ];

          const i1 = seed % intros.length;
          const i2 = (seed * 7 + 13) % middles.length; 
          const i3 = (seed * 3 + 7) % outros.length;
          const adviceIndex = (seed * 11) % advices.length;
          const foodIndex = (seed * 17) % foods.length;
          const moodIndex = (seed * 23) % moods.length;

          const n1 = (seed % 90) + 1;
          const n2 = ((seed * 5) % 90) + 1;
          const n3 = ((seed * 11) % 90) + 1;

          return {
            text: `${intros[i1]} ${middles[i2]} ${outros[i3]}`,
            stats: stats,
            advice: advices[adviceIndex],
            food: foods[foodIndex],
            numbers: [n1, n2, n3],
            mood: moods[moodIndex]
          };
        };

        // --- COMPONENTI UI ---

        const StarField = ({ theme }) => {
          const stars = useMemo(() => {
            return [...Array(60)].map((_, i) => ({
              top: `${Math.random() * 100}%`,
              left: `${Math.random() * 100}%`,
              width: `${Math.random() * 3 + 1}px`,
              height: `${Math.random() * 3 + 1}px`,
              animationDuration: `${Math.random() * 3 + 1}s`,
              animationDelay: `${Math.random() * 2}s`
            }));
          }, []);

          const starClass = theme === 'dark' 
            ? 'bg-white shadow-[0_0_2px_#fff]' 
            : 'bg-yellow-500 shadow-[0_0_2px_#fbbf24]';

          return (
            <div className={`fixed inset-0 z-0 pointer-events-none overflow-hidden theme-transition ${theme === 'dark' ? 'bg-slate-950' : 'bg-orange-50'}`}>
              <div className={`absolute inset-0 bg-gradient-to-b ${theme === 'dark' ? 'from-slate-950 via-indigo-950/20 to-slate-950' : 'from-orange-50 via-yellow-100/30 to-orange-50'}`}></div>
              {stars.map((star, i) => (
                <div
                  key={i}
                  className={`absolute rounded-full opacity-60 animate-pulse ${starClass} theme-transition`}
                  style={star}
                />
              ))}
            </div>
          );
        };

        const Logo = () => (
          <div className="relative group cursor-pointer">
            <div className="absolute inset-0 bg-orange-500 blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-500 rounded-full"></div>
            <div className="relative bg-gradient-to-br from-yellow-400 to-orange-600 p-3 rounded-2xl shadow-xl shadow-orange-500/20 transform transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3">
              <div className="relative w-8 h-8 md:w-10 md:h-10">
                <Icons.Sun className="absolute inset-0 w-full h-full text-white animate-[spin_10s_linear_infinite]" />
                <div className="absolute inset-0 flex items-center justify-center">
                     <span className="text-xs md:text-sm font-black text-orange-900 animate-pulse">AV</span>
                </div>
              </div>
            </div>
          </div>
        );

        const NetworkBanner = ({ theme }) => {
            const phrases = [
                "Se questo t'ha detto male, prova su",
                "Te senti sfigato? Vai su",
                "Gigi c'ha i cugini: ",
                "Pe artre perle de saggezza:",
                "Se voj sapè de più su Roma:"
            ];
            const [phrase, setPhrase] = useState(phrases[0]);

            useEffect(() => {
                setPhrase(phrases[Math.floor(Math.random() * phrases.length)]);

            return (

            const heroPhrases = ["Sceji er segno tuo. Senza giri de parole, pane ar pane e vino ar vino.", "Clicca sur segno tuo e scopri se oggi devi ride o devi piagne.", "Non è vero ma ce credo. O forse sì. Vabbè, tu clicca.", "L'unico oroscopo che non te manna a dì. Schietto e sincero.", "Sei pronto a sentì la verità? O preferisci le bugie de l'altri?", "Daje, sbrigati a cliccà che le stelle non aspettano nessuno.", "Er destino è scritto, ma noi glie damo n'occhiata prima.", "Oggi le stelle c'hanno la luna storta o te sorridono? Scoprilo.", "Mettite comodo, pjate 'n caffè e leggi che t'ho preparato.", "Nessun algoritmo, solo pura saggezza (e un po' de fortuna)."];

        const HoroscopeModal = ({ sign, isOpen, onClose, theme }) => {
          const [loading, setLoading] = useState(true);
          const [data, setData] = useState(null);
          const [progress, setProgress] = useState(0);
          const [copied, setCopied] = useState(false);
          const [loadingText, setLoadingText] = useState("");

          useEffect(() => {
            if (isOpen) {
              setLoading(true);
              setProgress(0);

              const phrases = ["Sto a chiede a Sora Lella...", "Sto a sentì Albertone...", "Mandrake sta a mischià le carte...", "Nerone sta a accenne er foco...", "Sto a consultà l'antichi...", "Er Papa sta a guardà le stelle..."];
              setLoadingText(phrases[0]);

              localStorage.setItem('savedSignId', sign.id);

              let phraseIndex = 0;
              const textInterval = setInterval(() => {
                phraseIndex = (phraseIndex + 1) % phrases.length;
                setLoadingText(phrases[phraseIndex]);
              }, 800);

              const interval = setInterval(() => {
                setProgress(prev => {
                  if (prev >= 100) {
                    clearInterval(interval);
                    clearInterval(textInterval);
                    return 100;
                  }
                  return prev + 4;
                });
              }, 80);

              setTimeout(() => {
                setData(generateRomanHoroscope(sign, sign.element));
                setLoading(false);

              return () => {
                clearInterval(interval);
                clearInterval(textInterval);
              };
            }
          }, [isOpen, sign]);

          const handleShare = async () => {
            if (!data) return;

            const text = `🔥 ${sign.name.toUpperCase()} secunno GIGI 🔥\n\n"${data.text}"\n\n💡 Consiglio: ${data.advice}\n🍝 Magna: ${data.food}\n🍀 Numeri: ${data.numbers.join('-')}\n\n👉 Leggi er tuo su AstriVostri.com`;
            
            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'AstriVostri',
                        text: text,
                        url: 'https://astrivostri.com'
                    });
                } else {
                    throw new Error("Web Share not supported");
                }
            } catch (err) {
                // Fallback robusto
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";

                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2500);

        const App = () => {
          const [selectedSign, setSelectedSign] = useState(null);

          const [theme, setTheme] = useState('dark');

                        <div className={`absolute inset-0 bg-gradient-to-br transition-all duration-500 ${theme === 'dark' ? 'from-yellow-500/0 via-transparent to-purple-500/0 group-hover:from-yellow-500/10' : 'from-orange-200/0 via-transparent to-yellow-200/0 group-hover:from-orange-100/50'}`} />
                        <div className="relative z-10 flex flex-col items-center text-center">
                            <div className={`w-14 h-14 mb-3 rounded-full flex items-center justify-center transition-colors border shadow-inner ${theme === 'dark' ? 'bg-slate-950 border-slate-800' : 'bg-orange-50 border-orange-100'}`}>
                                <Icon path={sign.icon} className={`w-8 h-8 transition-colors ${theme === 'dark' ? 'text-slate-400 group-hover:text-yellow-400' : 'text-slate-500 group-hover:text-orange-500'}`} />
                            </div>
                            <h3 className={`text-lg font-black ${theme === 'dark' ? 'text-slate-100 group-hover:text-yellow-400' : 'text-slate-800 group-hover:text-orange-600'}`}>{sign.name}</h3>
                            <p className="text-[10px] font-bold uppercase opacity-50">{sign.dates}</p>
                        </div>
                    </div>
                  ))}
                </div>
              </main>

              <footer className={`relative z-10 border-t py-12 ${theme === 'dark' ? 'border-white/5 bg-slate-950' : 'border-orange-200 bg-orange-50'}`}>
                <div className="container mx-auto px-4 text-center">
                  <div className="flex items-center justify-center gap-3 mb-6">
                     <div className="animate-spin-slow"><Icons.Sun className="w-5 h-5 text-yellow-500" /></div>
                     <span className={`font-black text-lg italic ${theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}`}>AstriVostri.com</span>
                  </div>
                  <p className={`text-xs max-w-md mx-auto leading-relaxed ${theme === 'dark' ? 'text-slate-600' : 'text-slate-500'}`}>
                    © 2024 AstriVostri. Oroscopo satirico. Se le stelle non so' d'accordo, prenditela co' loro e co' chi ve li manna.
                  </p>
                </div>
              </footer>

              <CookieBanner theme={theme} />
              <HoroscopeModal sign={selectedSign} isOpen={!!selectedSign} onClose={() => setSelectedSign(null)} theme={theme} />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
